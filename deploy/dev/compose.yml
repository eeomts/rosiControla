name: controla-dev

services:

  db:
    ports:

      - "127.0.0.1:${PORTA_DB_LOCAL:-13306}:3306"
    volumes:

      - ./data/dev-mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  app:
    volumes:
      - ./deploy/dev/config.ini:/var/www/html/config/config.ini:ro
      - ./deploy/dev/php.ini:/usr/local/etc/php/conf.d/controla.ini:ro

      - ./src:/var/www/html/src
      - ./templates:/var/www/html/templates
      - ./routing:/var/www/html/routing
      - ./cubo/src:/var/www/html/cubo/src
      # o index.php roda AQUI, no php-fpm -- montar public/ so no nginx
      # faz o dev servir asset novo com front controller velho
      - ./public:/var/www/html/public:ro
      - ./data/logs:/var/www/html/storage/logs

  web:

    volumes:
      - ./public:/var/www/html/public:ro
