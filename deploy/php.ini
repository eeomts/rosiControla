; php.ini do container. Quem decide se o erro aparece na tela e o `enviroment`
; do config.ini;

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; a imagem oficial do php-fpm ja tem catch_workers_output = yes, entao isto sai
; no `docker compose logs app`
error_log = /proc/self/fd/2

memory_limit = 256M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 16M

date.timezone = America/Sao_Paulo
default_charset = UTF-8

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; o codigo so muda quando a imagem e reconstruida, entao nao ha o que revalidar
opcache.validate_timestamps = 0

session.cookie_httponly = 1
session.cookie_samesite = Lax
; ligar quando o host.<location> for https
; session.cookie_secure = 1
